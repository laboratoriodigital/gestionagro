# Despliegue de un destino (staging o produccion), reutilizable: lo llama desplegar.yml.
# Cada destino corre en su ambiente de GitHub, que pone sus propios secretos y reglas
# (docs/runbooks/ambientes-github.md). Las entradas van por variables de entorno, nunca
# interpoladas en los comandos (inyección).
name: desplegar-destino

on:
  workflow_call:
    inputs:
      destino:
        description: "staging o produccion"
        required: true
        type: string
      ref:
        description: "El commit exacto que se despliega"
        required: true
        type: string
      solo_celda:
        description: "Opcional: desplegar solo esta celda"
        required: false
        default: ""
        type: string
      productos:
        description: "Qué productos: core, agro, parqueadero, tienda o varios (core,agro). Vacío: core y agro (HU-C0.3)"
        required: false
        default: ""
        type: string
      decidir_publicacion:
        description: "Después de desplegar, decidir qué versiones son nuevas (solo staging tras una fusión)"
        required: false
        default: false
        type: boolean
    # Lo que decidió la publicación (scripts/decidir-publicacion.ts). Antes era un trabajo aparte,
    # que se cobraba como un minuto en cada fusión solo por preparar Node (HU-C11.8).
    outputs:
      version_agro:
        value: ${{ jobs.desplegar.outputs.version_agro }}
      publicar_agro:
        value: ${{ jobs.desplegar.outputs.publicar_agro }}
      version_core:
        value: ${{ jobs.desplegar.outputs.version_core }}
      publicar_core:
        value: ${{ jobs.desplegar.outputs.publicar_core }}
      version_parqueadero:
        value: ${{ jobs.desplegar.outputs.version_parqueadero }}
      publicar_parqueadero:
        value: ${{ jobs.desplegar.outputs.publicar_parqueadero }}
      version_tienda:
        value: ${{ jobs.desplegar.outputs.version_tienda }}
      publicar_tienda:
        value: ${{ jobs.desplegar.outputs.publicar_tienda }}
      productos:
        value: ${{ jobs.desplegar.outputs.productos }}

# Su propio grupo por destino: el flujo que lo llama ya tiene el grupo «desplegar», y pedir el
# mismo grupo desde aquí lo dejaría esperándose a sí mismo.
concurrency:
  group: desplegar-${{ inputs.destino }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.destino }}
    outputs:
      version_agro: ${{ steps.leer.outputs.version_agro }}
      publicar_agro: ${{ steps.leer.outputs.publicar_agro }}
      version_core: ${{ steps.leer.outputs.version_core }}
      publicar_core: ${{ steps.leer.outputs.publicar_core }}
      version_parqueadero: ${{ steps.leer.outputs.version_parqueadero }}
      publicar_parqueadero: ${{ steps.leer.outputs.publicar_parqueadero }}
      version_tienda: ${{ steps.leer.outputs.version_tienda }}
      publicar_tienda: ${{ steps.leer.outputs.publicar_tienda }}
      productos: ${{ steps.leer.outputs.productos }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar
        run: pnpm install --frozen-lockfile
      - name: Construir (sitio, cuaderno y validación de wrangler)
        run: pnpm build
      # HU-C11.3 CA2 (opción B del dueño, 12 oct 2026): un paso por parte, en orden, y cada uno con
      # solo sus secretos (`SECRETOS_DE_LA_PARTE` en scripts/lib/publicacion.ts; una prueba ata los
      # dos). Una parte sin nada que desplegar termina en segundos. Si una falla, las de después no corren.
      - name: Desplegar el CORE
        env:
          # HU-E4.2 y HU-E0.7: entrar con Google y las llaves de Bold, solo para el Worker del CORE.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BOLD_IDENTIDAD_PRUEBAS: ${{ secrets.BOLD_IDENTIDAD_PRUEBAS }}
          BOLD_SECRETA_PRUEBAS: ${{ secrets.BOLD_SECRETA_PRUEBAS }}
          BOLD_IDENTIDAD_PRODUCCION: ${{ secrets.BOLD_IDENTIDAD_PRODUCCION }}
          BOLD_SECRETA_PRODUCCION: ${{ secrets.BOLD_SECRETA_PRODUCCION }}
          # HU-C7.7: los radicados de la Ley 1581 le llegan al dueño por Telegram.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DESTINO: ${{ inputs.destino }}
          SOLO_CELDA: ${{ inputs.solo_celda }}
          PRODUCTOS: ${{ inputs.productos }}
        run: node scripts/desplegar.ts --destino "$DESTINO" --solo "$SOLO_CELDA" --productos "$PRODUCTOS" --parte core
      - name: Desplegar el agro (celdas y sitio)
        env:
          # HU-E8.2 y HU-E8.3: el vigía de la celda mide con el token de métricas y avisa por Telegram.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_METRICAS_TOKEN: ${{ secrets.CF_METRICAS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DESTINO: ${{ inputs.destino }}
          SOLO_CELDA: ${{ inputs.solo_celda }}
          PRODUCTOS: ${{ inputs.productos }}
        run: node scripts/desplegar.ts --destino "$DESTINO" --solo "$SOLO_CELDA" --productos "$PRODUCTOS" --parte agro
      - name: Desplegar el parqueadero
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DESTINO: ${{ inputs.destino }}
          SOLO_CELDA: ${{ inputs.solo_celda }}
          PRODUCTOS: ${{ inputs.productos }}
        run: node scripts/desplegar.ts --destino "$DESTINO" --solo "$SOLO_CELDA" --productos "$PRODUCTOS" --parte parqueadero
      # HU-T2.4: la Tienda, sola en su paso. Mientras no tenga tiendas (hasta HU-T2.9) no detiene la
      # publicación de los otros productos: si falla, el paso queda en rojo y el resumen dice por qué,
      # pero el trabajo sigue. Sin SECRETO_DESPACHO en el ambiente, falla diciendo cómo generarlo.
      - name: Desplegar la Tienda
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SECRETO_DESPACHO: ${{ secrets.SECRETO_DESPACHO }}
          TIENDA_KEK_V1: ${{ secrets.TIENDA_KEK_V1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DESTINO: ${{ inputs.destino }}
          SOLO_CELDA: ${{ inputs.solo_celda }}
          PRODUCTOS: ${{ inputs.productos }}
        run: node scripts/desplegar.ts --destino "$DESTINO" --solo "$SOLO_CELDA" --productos "$PRODUCTOS" --parte tienda
      # Solo si staging quedó desplegado: qué versiones del commit no tienen etiqueta (HU-C0.3).
      - id: leer
        name: Leer las versiones y buscar sus etiquetas
        if: inputs.decidir_publicacion
        run: node scripts/decidir-publicacion.ts
