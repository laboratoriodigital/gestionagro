# Las herramientas de scripts/ corren en la máquina del dueño, que es Windows (P3, ADR-18).
# Por costo de minutos (Windows cuenta doble): solo si cambian scripts/ o las dependencias,
# y los lunes a las 07:00 hora de Colombia (12:00 UTC).
name: scripts-windows

on:
  pull_request:
    paths:
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/scripts-windows.yml"
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: scripts-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Verificar en Windows
        run: node scripts/verificar.ts --ci
