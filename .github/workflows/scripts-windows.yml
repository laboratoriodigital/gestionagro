# Las herramientas de scripts/ corren en la máquina del dueño, que es Windows (P3, ADR-18).
# Por costo de minutos (Windows cuenta doble): una vez por cambio, cuando llega a main y toca
# scripts/ o las dependencias, no en cada push de un PR (8 oct 2026: era un cuarto de los minutos
# del mes); los lunes a las 07:00 hora de Colombia (12:00 UTC), y a mano. `package.json` ya no lo
# dispara (HU-C11.8, 12 oct 2026): cada versión del agro lo cambia solo en el número, y eran 12
# minutos por publicación; un cambio de dependencias cambia también `pnpm-lock.yaml`.
name: scripts-windows

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/scripts-windows.yml"
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: scripts-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    # Con el runner propio (que es Windows), corre ahí; si no, en los equipos Windows de GitHub.
    runs-on: ${{ vars.RUNNER_CI || 'windows-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Verificar en Windows
        run: node scripts/verificar.ts --ci --sin-e2e
