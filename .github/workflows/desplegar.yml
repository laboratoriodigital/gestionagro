# Despliegue por celdas (HU-E1.5, ARQUITECTURA §7.3), con publicación continua (4 oct 2026).
#
# Al fusionar un PR a main, sin más pasos a mano que aprobar el PR:
#   1. El CI termina en verde por un push a main → se despliega staging.
#   2. Si la versión del agro (package.json), la del CORE (apps/core/package.json) o la del
#      parqueadero (apps/parqueadero-sitio/package.json) no tiene su etiqueta, se publica: vX.Y.Z,
#      core-vX.Y.Z o parqueadero-vX.Y.Z, y la versión en GitHub con las notas de su CHANGELOG
#      (HU-C0.3, HU-Q0.3). El parqueadero en 0.0.0 no se publica: vive en staging.
#   3. Se despliega a producción solo lo que se publicó, con ese mismo commit, en esta misma corrida.
#      (Una versión creada con el token de Actions no dispara otros flujos: por eso no se espera al
#      evento «release».)
# Un PR que no sube ninguna versión solo llega a staging.
#
# A mano: «Run workflow» eligiendo destino (y, para seguir después de una falla, una sola celda),
# o una versión publicada a mano. Un despliegue a medias no se cancela: la corrida nueva espera.
name: desplegar

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      destino:
        description: "staging o produccion"
        required: true
        default: staging
        type: choice
        options: [staging, produccion]
      solo_celda:
        description: "Opcional: desplegar solo esta celda (p. ej. c0)"
        required: false
        default: ""

# Un solo grupo para todos los despliegues: nunca dos a la vez sobre las mismas cuentas.
concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    # Revisión de seguridad (3 oct 2026): el filtro «branches: [main]» de workflow_run mira solo el
    # NOMBRE de la rama. Un PR desde un fork con una rama llamada «main» pasaba el filtro, y este
    # trabajo corría su código con todos los secretos. Solo se despliega lo que llegó a main de
    # este repositorio por un push.
    if: >-
      github.event_name == 'workflow_run' && (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    uses: ./.github/workflows/desplegar-destino.yml
    with:
      destino: staging
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  version:
    # ¿Qué versiones del commit son nuevas? Dos productos con versión propia (HU-C0.3): el agro
    # (package.json, etiquetas vX.Y.Z) y el CORE (apps/core/package.json, core-vX.Y.Z). Cada uno se
    # publica y va a producción solo cuando sube su versión.
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_agro: ${{ steps.leer.outputs.version_agro }}
      publicar_agro: ${{ steps.leer.outputs.publicar_agro }}
      version_core: ${{ steps.leer.outputs.version_core }}
      publicar_core: ${{ steps.leer.outputs.publicar_core }}
      version_parqueadero: ${{ steps.leer.outputs.version_parqueadero }}
      publicar_parqueadero: ${{ steps.leer.outputs.publicar_parqueadero }}
      productos: ${{ steps.leer.outputs.productos }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: leer
        name: Leer las versiones y buscar sus etiquetas
        run: node scripts/decidir-publicacion.ts

  publicar:
    needs: version
    if: needs.version.outputs.productos != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Crear la versión del agro con las notas del CHANGELOG
        if: needs.version.outputs.publicar_agro == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version_agro }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node scripts/notas-de-version.ts "$VERSION" > notas.md
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --notes-file notas.md
      - name: Crear la versión del CORE con las notas de su CHANGELOG
        if: needs.version.outputs.publicar_core == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version_core }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node scripts/notas-de-version.ts --core "$VERSION" > notas-core.md
          gh release create "core-v$VERSION" --target "$SHA" --title "CORE v$VERSION" --notes-file notas-core.md --latest=false
      - name: Crear la versión del parqueadero con las notas de su CHANGELOG
        if: needs.version.outputs.publicar_parqueadero == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version_parqueadero }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node scripts/notas-de-version.ts --parqueadero "$VERSION" > notas-parqueadero.md
          gh release create "parqueadero-v$VERSION" --target "$SHA" --title "Parqueadero v$VERSION" --notes-file notas-parqueadero.md --latest=false

  produccion:
    # Solo lo que subió de versión: el agro sin el CORE, el CORE sin el agro, o los dos.
    needs: [version, publicar]
    uses: ./.github/workflows/desplegar-destino.yml
    with:
      destino: produccion
      ref: ${{ github.event.workflow_run.head_sha }}
      productos: ${{ needs.version.outputs.productos }}
    secrets: inherit

  a-mano:
    # «Run workflow», o una versión publicada a mano en GitHub.
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/desplegar-destino.yml
    with:
      destino: ${{ github.event_name == 'release' && 'produccion' || inputs.destino }}
      ref: ${{ github.sha }}
      solo_celda: ${{ inputs.solo_celda || '' }}
    secrets: inherit
