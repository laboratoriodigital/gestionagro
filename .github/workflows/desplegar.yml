# Despliegue por celdas (HU-E1.5, ARQUITECTURA §7.3).
# - Staging: cuando el CI termina en verde en main (nunca se despliega lo que no pasó el CI).
# - Producción: al publicar una versión vX.Y.Z (la publica el dueño).
# - A mano: «Run workflow», eligiendo destino y, para seguir después de una falla, una sola celda.
# Un despliegue a medias no se cancela: la corrida nueva espera a que termine la anterior.
name: desplegar

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      destino:
        description: "staging o produccion"
        required: true
        default: staging
        type: choice
        options: [staging, produccion]
      solo_celda:
        description: "Opcional: desplegar solo esta celda (p. ej. c0)"
        required: false
        default: ""

# Un solo grupo para todos los despliegues: nunca dos a la vez sobre las mismas cuentas.
concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    # Revisión de seguridad (3 oct 2026): el filtro «branches: [main]» de workflow_run mira solo el
    # NOMBRE de la rama. Un PR desde un fork con una rama llamada «main» pasaba el filtro, y este
    # trabajo corría su código con todos los secretos. Solo se despliega lo que llegó a main de
    # este repositorio por un push.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'release' && 'produccion' || inputs.destino || 'staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # En workflow_run se despliega exactamente el commit que pasó el CI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar
        run: pnpm install --frozen-lockfile
      - name: Construir (sitio, cuaderno y validación de wrangler)
        run: pnpm build
      - name: Desplegar por celdas
        # Las entradas van por variables de entorno, nunca interpoladas en el comando (inyección).
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # HU-E8.2: token de solo lectura de métricas, para el vigía de cuota de la celda.
          CF_METRICAS_TOKEN: ${{ secrets.CF_METRICAS_TOKEN }}
          # HU-E8.3: alertas del vigía al dueño por Telegram.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # HU-E4.2: el despliegue los carga como secretos del Worker del CORE, por stdin.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # HU-E0.7: llaves del Botón de pagos de Bold. Opcionales: sin ellas, pagar no está disponible.
          BOLD_IDENTIDAD_PRUEBAS: ${{ secrets.BOLD_IDENTIDAD_PRUEBAS }}
          BOLD_SECRETA_PRUEBAS: ${{ secrets.BOLD_SECRETA_PRUEBAS }}
          BOLD_IDENTIDAD_PRODUCCION: ${{ secrets.BOLD_IDENTIDAD_PRODUCCION }}
          BOLD_SECRETA_PRODUCCION: ${{ secrets.BOLD_SECRETA_PRODUCCION }}
          DESTINO: ${{ github.event_name == 'release' && 'produccion' || inputs.destino || 'staging' }}
          SOLO_CELDA: ${{ inputs.solo_celda }}
        run: node scripts/desplegar.ts --destino "$DESTINO" --solo "$SOLO_CELDA"
