# CI de cada pull request y de main (HU-E1.2, ARQUITECTURA §7.2).
# Todo corre en un solo paso para que el resumen nombre TODAS las fallas (P15).
name: ci

on:
  # Un PR en borrador no gasta minutos: corre al marcarlo listo y en cada push después (HU-C11.8).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # La corrida semanal de main con todo y el D1 de workerd: la red de lo que los PR no corrieron
  # (HU-C11.7 CA2, HU-C11.8). Lunes 06:00 de Colombia.
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Para preguntar si el PR que llegó a main ya tenía su CI en verde (scripts/ya-verificado.ts).
  actions: read

jobs:
  verificar:
    # Los equipos de GitHub, salvo que la variable del repositorio RUNNER_CI diga otra cosa: el runner
    # propio del dueño se usa mientras GitHub Actions no arranca trabajos (docs/runbooks/runner-propio.md).
    # Borrar la variable devuelve el CI a GitHub sin tocar este archivo.
    runs-on: ${{ vars.RUNNER_CI || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # 15 minutos con el repositorio privado (cuidan los 2.000 del mes); 30 con el público, que no se
    # cobra: un espejo de Ubuntu lento no corta un PR sano (bitácora core 13, PR #230).
    timeout-minutes: ${{ github.event.repository.private && 15 || 30 }}
    steps:
      - uses: actions/checkout@v7
        with:
          # La historia completa: verificar compara contra la base del cambio (HU-C11.6) y la
          # guardia de commits lee los del PR (HU-C0.2). Este repositorio pesa poco.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Antes de instalar: un commit fuera de la convención se sabe en un segundo, y la corrida
      # se detiene ahí en vez de gastar minutos que habrá que repetir con el commit corregido.
      - name: Convención de commits y del PR
        if: github.event_name == 'pull_request'
        env:
          COMMITS_DESDE: ${{ github.event.pull_request.base.sha }}
          COMMITS_HASTA: ${{ github.event.pull_request.head.sha }}
          PR_TITULO: ${{ github.event.pull_request.title }}
          PR_CUERPO: ${{ github.event.pull_request.body }}
        run: node scripts/verificar-commits.ts
      # Una versión publicada no se reescribe: lo nuevo va en «Sin publicar». En los PR y en main,
      # porque dos PR bien hechos pueden juntarse mal al fusionar (bitácora core 6). Sin instalar nada.
      - name: Versiones publicadas sin reescribir
        run: node scripts/verificar-changelog.ts
      # En main: si el PR fusionado estaba al día, su CI ya probó este mismo árbol, y no se repite
      # nada (HU-C11.8: eran 4 minutos de pruebas con workerd en cada fusión).
      - name: ¿El PR ya verificó este mismo árbol?
        id: pr
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ya-verificado.ts
      # Con un lockfile nuevo no hay coincidencia exacta: restore-keys trae los navegadores de la
      # corrida anterior y Playwright solo baja lo que cambió (bitácora agro 19).
      - name: Caché de los navegadores de Playwright
        if: steps.pr.outputs.verificado != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Verificar (instalar, lint, typecheck, contratos, pruebas, build, e2e, licencias)
        # Contra qué se compara el cambio: la base del PR o el main de antes del push. Si el cambio
        # solo toca documentos, verificar salta lo que no puede cambiar de resultado (HU-C11.6).
        env:
          # En el runner propio (Windows), el Edge del equipo: la descarga de Chromium no funciona ahí.
          # Los PR prueban la base con el instrumento en proceso (rápido), salvo que el cambio toque
          # la base: entonces con el D1 local de workerd (fiel, P17). `auto` lo decide verificar.ts
          # con la lista de cambios (HU-C11.8). Main sin verificar y la corrida semanal: workerd.
          D1_INSTRUMENTO: ${{ github.event_name == 'pull_request' && 'auto' || 'workerd' }}
          PW_CANAL: ${{ vars.RUNNER_CI == 'self-hosted' && 'msedge' || '' }}
          VERIFICAR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFICADO_EN_PR: ${{ steps.pr.outputs.verificado }}
        run: node scripts/verificar.ts --ci
      # Solo si algo falló: lo que Playwright vio (la página y el error) para entender una e2e
      # intermitente sin volver a correrla a ciegas. Tres días bastan; no ocupa espacio si todo pasa.
      - name: Contexto de las e2e que fallaron
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fallidas
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
